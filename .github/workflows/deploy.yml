name: Build and deploy

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # favicon_maker shells out to ImageMagick's `convert`
      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - uses: ruby/setup-ruby@v1
        with:
          # Newer runner images only ship the latest patch of each series, so
          # track 3.3.x here rather than the exact .ruby-version pin.
          ruby-version: '3.3'
          bundler-cache: true # runs bundle install and caches gems

      - name: Build site
        run: bundle exec middleman build --verbose

      # Publishes ./build to the gh-pages branch (what GitHub Pages serves).
      - name: Deploy to gh-pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build # includes CNAME from source/
